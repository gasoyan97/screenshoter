# Сборка ScreenShoter в DMG и публикация в Release
#
# Trunk base: для каждого релиза создаётся ветка release/X.Y.Z, сборка идёт из неё.
#
# Запуск: создайте и запушьте тег v* (например v0.0.5)
#   git tag v0.0.5
#   git push origin v0.0.5
#
# Workflow создаст ветку release/0.0.5 от тега и соберёт из неё.
#
# Работает БЕЗ Apple Developer Program — создаёт DMG для размещения на своём сайте.
# Пользователям при первом запуске: правый клик → Открыть (из-за Gatekeeper).
#
# Если есть Apple Developer: добавьте секреты для подписи и нотаризации (см. BUILD_DMG.md)

name: Build DMG

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "release_branch=release/$VERSION" >> $GITHUB_OUTPUT
          echo "Building version $VERSION"

      - name: Create and push release branch
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          RELEASE_BRANCH="release/$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$RELEASE_BRANCH"
          git push -u origin "$RELEASE_BRANCH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Info.plist version
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          plutil -replace CFBundleShortVersionString -string "$VERSION" ScreenShoter/Info.plist
          # Build: 0.0.3 → 3, 1.2.34 → 1234
          BUILD=$(echo "$VERSION" | tr -cd '0-9')
          [ -z "$BUILD" ] && BUILD=1
          plutil -replace CFBundleVersion -string "$BUILD" ScreenShoter/Info.plist
          echo "Info.plist: CFBundleShortVersionString=$VERSION, CFBundleVersion=$BUILD"

      - name: Create Secrets.xcconfig from GitHub Secrets
        env:
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
        run: |
          mkdir -p ScreenShoter
          {
            echo "// Auto-generated by build-dmg workflow — do not commit"
            printf 'YANDEX_CLIENT_ID = %s\n' "${YANDEX_CLIENT_ID:-}"
            printf 'YANDEX_CLIENT_SECRET = %s\n' "${YANDEX_CLIENT_SECRET:-}"
          } > ScreenShoter/Secrets.xcconfig
          if [ -z "$YANDEX_CLIENT_ID" ] || [ -z "$YANDEX_CLIENT_SECRET" ]; then
            echo "::warning::YANDEX_CLIENT_ID или YANDEX_CLIENT_SECRET не заданы в GitHub Secrets — OAuth Яндекс.Диска будет недоступен"
          else
            echo "Secrets.xcconfig создан (OAuth credentials подставлены)"
          fi

      - name: Import certificates
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "SIGNING_ENABLED=false" >> $GITHUB_ENV
            echo "::notice::Без сертификата — сборка для своего сайта (правый клик → Открыть)"
            exit 0
          fi
          echo "SIGNING_ENABLED=true" >> $GITHUB_ENV
          echo "$BUILD_CERTIFICATE_BASE64" | base64 -d > build_certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import build_certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Build (with signing)
        if: env.SIGNING_ENABLED == 'true'
        env:
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
        run: |
          xcodebuild -project ScreenShoter.xcodeproj -scheme ScreenShoter -configuration Release \
            -archivePath build/ScreenShoter.xcarchive \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            archive
          xcodebuild -exportArchive \
            -archivePath build/ScreenShoter.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist .github/ExportOptions.plist

      - name: Build (without signing)
        if: env.SIGNING_ENABLED == 'false'
        env:
          YANDEX_CLIENT_ID: ${{ secrets.YANDEX_CLIENT_ID }}
          YANDEX_CLIENT_SECRET: ${{ secrets.YANDEX_CLIENT_SECRET }}
        run: |
          xcodebuild -project ScreenShoter.xcodeproj -scheme ScreenShoter -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            build
          mkdir -p build/export
          APP=build/DerivedData/Build/Products/Release/ScreenShoter.app
          [ -d "$APP" ] || APP=$(find build/DerivedData -name "ScreenShoter.app" -type d | head -1)
          cp -R "$APP" build/export/
          # Переподпись всего бандла ad-hoc (Sparkle иначе имеет другой Team ID и не запускается)
          codesign --force --deep --sign - build/export/ScreenShoter.app

      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dmg_root
          cp -R build/export/ScreenShoter.app dmg_root/
          ln -s /Applications dmg_root/Applications
          cp assets/installer-readme.txt dmg_root/Прочитайте\ меня.txt
          hdiutil create -volname "ScreenShoter $VERSION" -srcfolder dmg_root \
            -ov -format UDZO "ScreenShoter-$VERSION.dmg"

      - name: Sign DMG
        if: env.SIGNING_ENABLED == 'true'
        run: |
          if [ "$SIGNING_ENABLED" = "true" ]; then
            codesign --force --sign "Developer ID Application" "ScreenShoter-${{ steps.version.outputs.version }}.dmg"
          fi

      - name: Notarize
        if: env.SIGNING_ENABLED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ]; then exit 0; fi
          VERSION="${{ steps.version.outputs.version }}"
          xcrun notarytool submit "ScreenShoter-$VERSION.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait
          xcrun stapler staple "ScreenShoter-$VERSION.dmg"

      - name: Create ZIP for Sparkle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ditto -c -k --sequesterRsrc --keepParent build/export/ScreenShoter.app "ScreenShoter-$VERSION.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ScreenShoter ${{ steps.version.outputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            ScreenShoter-${{ steps.version.outputs.version }}.dmg
            ScreenShoter-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate appcast and deploy to Pages
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ github.ref_name }}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/$TAG"
          mkdir -p updates
          cp "ScreenShoter-$VERSION.zip" updates/
          SPARKLE_VERSION="2.8.1"
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" -o sparkle.tar.xz
          tar xf sparkle.tar.xz
          mkdir -p pages
          if [ -z "$SPARKLE_PRIVATE_KEY" ] || [ "$SPARKLE_PRIVATE_KEY" = "" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY not set — appcast without signature"
            ./bin/generate_appcast --download-url-prefix "$BASE_URL/" updates/ || ./bin/generate_appcast updates/
          else
            echo "$SPARKLE_PRIVATE_KEY" | tr -d '\n' | base64 -d | ./bin/generate_appcast --ed-key-file - --download-url-prefix "$BASE_URL/" updates/
          fi
          mv updates/appcast.xml pages/appcast.xml 2>/dev/null || true
          [ -f pages/appcast.xml ] || { echo "<?xml version=\"1.0\" encoding=\"utf-8\"?><rss version=\"2.0\" xmlns:sparkle=\"http://www.andymatuschak.org/xml-namespaces/sparkle\"><channel><title>ScreenShoter</title><description>Updates</description></channel></rss>" > pages/appcast.xml; }
          cat pages/appcast.xml

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

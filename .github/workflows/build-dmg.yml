# Сборка ScreenShoter в DMG и публикация в Release
#
# Запуск: создайте и запушьте тег v* (например v0.0.2)
#   git tag v0.0.2
#   git push origin v0.0.2
#
# Работает БЕЗ Apple Developer Program — создаёт DMG для размещения на своём сайте.
# Пользователям при первом запуске: правый клик → Открыть (из-за Gatekeeper).
#
# Если есть Apple Developer: добавьте секреты для подписи и нотаризации (см. BUILD_DMG.md)

name: Build DMG

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version $VERSION"

      - name: Import certificates
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "SIGNING_ENABLED=false" >> $GITHUB_ENV
            echo "::notice::Без сертификата — сборка для своего сайта (правый клик → Открыть)"
            exit 0
          fi
          echo "SIGNING_ENABLED=true" >> $GITHUB_ENV
          echo "$BUILD_CERTIFICATE_BASE64" | base64 -d > build_certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import build_certificate.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain

      - name: Build (with signing)
        if: env.SIGNING_ENABLED == 'true'
        run: |
          xcodebuild -project ScreenShoter.xcodeproj -scheme ScreenShoter -configuration Release \
            -archivePath build/ScreenShoter.xcarchive \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            archive
          xcodebuild -exportArchive \
            -archivePath build/ScreenShoter.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist .github/ExportOptions.plist

      - name: Build (without signing)
        if: env.SIGNING_ENABLED == 'false'
        run: |
          xcodebuild -project ScreenShoter.xcodeproj -scheme ScreenShoter -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            build
          mkdir -p build/export
          APP=build/DerivedData/Build/Products/Release/ScreenShoter.app
          [ -d "$APP" ] || APP=$(find build/DerivedData -name "ScreenShoter.app" -type d | head -1)
          cp -R "$APP" build/export/

      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dmg_root
          cp -R build/export/ScreenShoter.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "ScreenShoter $VERSION" -srcfolder dmg_root \
            -ov -format UDZO "ScreenShoter-$VERSION.dmg"

      - name: Sign DMG
        if: env.SIGNING_ENABLED == 'true'
        run: |
          if [ "$SIGNING_ENABLED" = "true" ]; then
            codesign --force --sign "Developer ID Application" "ScreenShoter-${{ steps.version.outputs.version }}.dmg"
          fi

      - name: Notarize
        if: env.SIGNING_ENABLED == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          if [ -z "$APPLE_ID" ]; then exit 0; fi
          VERSION="${{ steps.version.outputs.version }}"
          xcrun notarytool submit "ScreenShoter-$VERSION.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait
          xcrun stapler staple "ScreenShoter-$VERSION.dmg"

      - name: Create ZIP for Sparkle
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ditto -c -k --sequesterRsrc --keepParent build/export/ScreenShoter.app "ScreenShoter-$VERSION.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ScreenShoter ${{ steps.version.outputs.version }}
          draft: false
          generate_release_notes: true
          files: |
            ScreenShoter-${{ steps.version.outputs.version }}.dmg
            ScreenShoter-${{ steps.version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

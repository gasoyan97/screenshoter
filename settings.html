<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Настройки — Scrinsjater</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1e;
      color: #e4e4e7;
    }
    h2 { margin: 0 0 16px; font-size: 18px; }
    label { display: block; margin-bottom: 8px; font-size: 13px; color: #a1a1aa; }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      background: #252529;
      border: 1px solid #3f3f46;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
    }
    input:focus { outline: none; border-color: #3b82f6; }
    .hint {
      font-size: 12px;
      color: #71717a;
      margin-top: 8px;
    }
    a { color: #3b82f6; }
    .btn {
      margin-top: 20px;
      padding: 10px 20px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn:hover { background: #2563eb; }
  </style>
</head>
<body>
  <h2>Яндекс.Диск</h2>
  <label>OAuth токен</label>
  <input type="password" id="token" placeholder="Вставьте токен...">
  <p class="hint">
    Получить токен: <a href="#" id="getToken">oauth.yandex.ru</a><br>
    Разрешите доступ к «Яндекс.Диск» и скопируйте токен.
  </p>
  <button class="btn" id="save">Сохранить</button>
  <script>
    document.getElementById('getToken').addEventListener('click', (e) => {
      e.preventDefault();
      window.electronAPI.openExternal('https://oauth.yandex.ru/authorize?response_type=token&client_id=23cabbbdc6cd418abb4b39c32c41195d');
    });
    (async () => {
      const token = await window.electronAPI.getYandexToken();
      document.getElementById('token').value = token || '';
    })();
    document.getElementById('save').addEventListener('click', async () => {
      const token = document.getElementById('token').value.trim();
      await window.electronAPI.setYandexToken(token);
      alert('Настройки сохранены');
    });
  </script>
</body>
</html>

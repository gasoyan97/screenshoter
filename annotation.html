<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrinsjater</title>
  <link rel="stylesheet" href="annotation.css">
</head>
<body>
  <div class="titlebar">
    <div class="titlebar-drag"></div>
    <h1>Scrinsjater</h1>
    <div class="toolbar">
      <div class="tool-group">
        <button class="tool-btn active" data-tool="arrow" title="Стрелка">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
        <button class="tool-btn" data-tool="highlight" title="Выделение">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="8" width="18" height="10" rx="1"/></svg>
        </button>
      </div>
      <div class="tool-group color-picker">
        <button class="color-btn" data-color="#ef4444" style="background:#ef4444"></button>
        <button class="color-btn" data-color="#f97316" style="background:#f97316"></button>
        <button class="color-btn" data-color="#eab308" style="background:#eab308"></button>
        <button class="color-btn active" data-color="#22c55e" style="background:#22c55e"></button>
        <button class="color-btn" data-color="#3b82f6" style="background:#3b82f6"></button>
        <button class="color-btn" data-color="#8b5cf6" style="background:#8b5cf6"></button>
      </div>
      <div class="tool-group">
        <label class="size-label">
          <span>Толщина</span>
          <input type="range" id="strokeWidth" min="2" max="12" value="4">
        </label>
      </div>
      <button class="tool-btn" id="undo" title="Отменить">↶</button>
      <div class="tool-group actions">
        <label class="checkbox-label">
          <input type="checkbox" id="uploadYandex" checked>
          <span>Загрузить на Яндекс.Диск</span>
        </label>
        <button class="btn-save" id="save">Сохранить</button>
      </div>
    </div>
  </div>
  <div class="canvas-wrap">
    <canvas id="canvas"></canvas>
    <canvas id="overlay"></canvas>
  </div>
  <script src="annotation.js"></script>
</body>
</html>

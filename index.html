<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scrinsjater</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1e;
      color: #e4e4e7;
    }
    h1 { font-size: 18px; margin: 0 0 20px; font-weight: 600; }
    .btn {
      display: block;
      width: 100%;
      padding: 14px 18px;
      margin-bottom: 10px;
      background: #252529;
      border: 1px solid #3f3f46;
      border-radius: 10px;
      color: #fff;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover { background: #2d2d32; }
    .btn:active { background: #3f3f46; }
    .links { margin-top: 20px; display: flex; gap: 12px; }
    .links button {
      background: none;
      border: none;
      color: #71717a;
      font-size: 13px;
      cursor: pointer;
    }
    .links button:hover { color: #a1a1aa; }
  </style>
</head>
<body>
  <h1>Scrinsjater</h1>
  <button class="btn" data-mode="full">Вся область экрана</button>
  <button class="btn" data-mode="window">Окно (с тенью)</button>
  <button class="btn" data-mode="region">Выбранная область</button>
  <div class="links">
    <button id="settings">Настройки</button>
    <button id="quit">Выход</button>
  </div>
  <script>
    document.querySelectorAll('.btn[data-mode]').forEach(b => {
      b.addEventListener('click', () => window.electronAPI.capture(b.dataset.mode));
    });
    document.getElementById('settings').addEventListener('click', () => window.electronAPI.capture('settings'));
    document.getElementById('quit').addEventListener('click', () => window.electronAPI.quit());
  </script>
</body>
</html>

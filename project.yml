name: ScreenShoter
options:
  bundleIdPrefix: com.screentshoter
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
targets:
  ScreenShoter:
    type: application
    platform: macOS
    sources:
      - path: ScreenShoter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.screentshoter.app
        INFOPLIST_FILE: ScreenShoter/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ARCHS: arm64

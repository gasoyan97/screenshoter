name: Scrinsjater
options:
  bundleIdPrefix: com.scrinsjater
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
targets:
  Scrinsjater:
    type: application
    platform: macOS
    sources:
      - path: Scrinsjater
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scrinsjater.app
        INFOPLIST_FILE: Scrinsjater/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ARCHS: arm64
